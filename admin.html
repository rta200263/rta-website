<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RTA — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent;}
body{
  background:#030309;color:#ede9fe;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow-x:hidden;
}
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;
}
body::before{
  width:500px;height:500px;top:-150px;right:-100px;
  background:radial-gradient(circle,rgba(109,40,217,0.2) 0%,transparent 70%);
}
body::after{
  width:400px;height:400px;bottom:-100px;left:-80px;
  background:radial-gradient(circle,rgba(245,158,11,0.12) 0%,transparent 70%);
}
.wrap{position:relative;z-index:1;width:100%;max-width:500px;}

/* ── CARDS ── */
.card{
  background:linear-gradient(145deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid rgba(139,92,246,0.28);
  border-radius:28px;padding:36px 32px;
  box-shadow:0 0 80px rgba(139,92,246,0.18),0 40px 80px rgba(0,0,0,0.5);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#8b5cf6,#f59e0b,#22d3ee);
}

/* ── HEADER ── */
.admin-header{text-align:center;margin-bottom:32px;}
.logo-txt{
  font-size:2rem;font-weight:900;letter-spacing:5px;
  background:linear-gradient(135deg,#fff 0%,#c4b5fd 35%,#8b5cf6 60%,#f59e0b 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(139,92,246,0.6));
  display:block;margin-bottom:6px;
}
.admin-header p{font-size:0.82rem;color:rgba(237,233,254,0.45);letter-spacing:0.5px;}

/* ── FIELDS ── */
.field{margin-bottom:18px;}
label{display:block;font-size:0.78rem;font-weight:800;color:rgba(237,233,254,0.55);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(139,92,246,0.25);
  border-radius:14px;padding:14px 16px;
  color:#ede9fe;font-family:'Cairo',sans-serif;font-size:0.95rem;
  outline:none;transition:all 0.3s;
  -webkit-user-select:text;user-select:text;
}
input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,0.18);background:rgba(139,92,246,0.06);}
input::placeholder{color:rgba(237,233,254,0.25);}

/* ── BUTTONS ── */
.btn{
  width:100%;padding:15px;border-radius:16px;border:none;
  font-family:'Cairo',sans-serif;font-size:1rem;font-weight:900;
  cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:hidden;letter-spacing:0.5px;
}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background 0.2s;}
.btn:hover::after{background:rgba(255,255,255,0.1);}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:scale(0.97);}
.btn-login{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
  box-shadow:0 8px 32px rgba(139,92,246,0.45);
}
.btn-login:hover{box-shadow:0 14px 44px rgba(139,92,246,0.65);}
.btn-save{
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;
  box-shadow:0 8px 32px rgba(16,185,129,0.4);margin-top:4px;
}
.btn-save:hover{box-shadow:0 14px 44px rgba(16,185,129,0.6);}
.btn-danger{
  background:rgba(239,68,68,0.12);color:#fca5a5;
  border:1px solid rgba(239,68,68,0.3);box-shadow:none;
  font-size:0.82rem;padding:10px;margin-top:10px;
}
.btn-danger:hover{background:rgba(239,68,68,0.22);box-shadow:none;}

/* ── ERR ── */
.err{color:#fca5a5;font-size:0.82rem;text-align:center;margin-top:10px;font-weight:700;}

/* ── ADMIN PANEL ── */
#admin-screen{display:none;}
.stat-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;
}
.stat-box{
  background:rgba(139,92,246,0.08);
  border:1px solid rgba(139,92,246,0.22);
  border-radius:18px;padding:18px 16px;text-align:center;
}
.stat-box.gold{
  background:rgba(245,158,11,0.08);
  border-color:rgba(245,158,11,0.22);
}
.s-num{font-size:1.9rem;font-weight:900;color:#fff;line-height:1;}
.s-num.purple{color:#c4b5fd;}
.s-num.amber{color:#fbbf24;}
.s-lbl{font-size:0.7rem;color:rgba(237,233,254,0.45);margin-top:5px;font-weight:700;letter-spacing:0.5px;}

.section-hdr{
  display:flex;align-items:center;gap:8px;
  font-size:0.72rem;font-weight:900;color:#8b5cf6;
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:16px;margin-top:28px;
}
.section-hdr::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(to left,transparent,rgba(139,92,246,0.25));
}

.msg{
  padding:14px 18px;border-radius:14px;font-size:0.88rem;font-weight:800;
  text-align:center;margin-top:16px;display:none;
  animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.msg-ok{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.35);color:#6ee7b7;}
.msg-err{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}

.token-note{font-size:0.72rem;color:rgba(237,233,254,0.35);margin-top:8px;line-height:1.7;}
.token-saved{
  display:none;align-items:center;gap:8px;
  background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.22);
  border-radius:10px;padding:10px 14px;font-size:0.78rem;color:#6ee7b7;font-weight:700;
  margin-top:10px;
}
.token-saved i{color:#10b981;}

.back-link{
  display:flex;align-items:center;gap:6px;justify-content:center;
  margin-top:20px;font-size:0.8rem;color:rgba(237,233,254,0.35);
  cursor:pointer;transition:color 0.2s;
}
.back-link:hover{color:#8b5cf6;}

/* ── DIVIDER ── */
hr{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:24px 0;}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== LOGIN ===== -->
<div class="card" id="login-screen">
  <div class="admin-header">
    <span class="logo-txt">RTA</span>
    <p>🔐 لوحة التحكم السرية</p>
  </div>
  <div class="field">
    <label>كلمة المرور</label>
    <input type="password" id="pass-input" placeholder="أدخل كلمة المرور" autocomplete="off">
  </div>
  <button class="btn btn-login" onclick="doLogin()"><i class="bi bi-unlock-fill"></i> دخول</button>
  <p class="err" id="login-err"></p>
</div>

<!-- ===== ADMIN ===== -->
<div class="card" id="admin-screen">
  <div class="admin-header">
    <span class="logo-txt">RTA</span>
    <p>⚙️ لوحة الإدارة</p>
  </div>

  <!-- Stats -->
  <div class="stat-row">
    <div class="stat-box">
      <div class="s-num purple" id="visit-count">—</div>
      <div class="s-lbl">إجمالي الزيارات</div>
    </div>
    <div class="stat-box gold">
      <div class="s-num amber" id="today-count">—</div>
      <div class="s-lbl">اليوم</div>
    </div>
  </div>

  <!-- Links section -->
  <div class="section-hdr"><i class="bi bi-link-45deg"></i> تعديل الروابط</div>

  <div class="field">
    <label><i class="bi bi-discord"></i> ديسكورد</label>
    <input type="url" id="f-discord" placeholder="https://discord.gg/...">
  </div>
  <div class="field">
    <label><i class="bi bi-youtube"></i> يوتيوب</label>
    <input type="url" id="f-youtube" placeholder="https://youtube.com/@...">
  </div>
  <div class="field">
    <label><i class="bi bi-phone-fill"></i> رابط التثبيت</label>
    <input type="url" id="f-download" placeholder="https://...">
  </div>

  <!-- Token section -->
  <div class="section-hdr"><i class="bi bi-key-fill"></i> GitHub Token</div>

  <div class="field">
    <input type="password" id="f-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <p class="token-note">يُحفظ تلقائياً في جهازك — لن تحتاج تدخله مرة ثانية.</p>
    <div class="token-saved" id="token-saved-badge">
      <i class="bi bi-check-circle-fill"></i> توكن محفوظ — جاهز للاستخدام
    </div>
  </div>

  <button class="btn btn-save" onclick="saveLinks()">
    <i class="bi bi-cloud-arrow-up-fill"></i> حفظ وتحديث الروابط
  </button>
  <button class="btn btn-danger" onclick="clearToken()">
    <i class="bi bi-trash3"></i> مسح التوكن المحفوظ
  </button>

  <div class="msg" id="save-msg"></div>
  <hr>
  <div class="back-link" onclick="window.location.href='/'">
    <i class="bi bi-arrow-right"></i> العودة للموقع
  </div>
</div>

</div>
<script>
const PASS        = 'RTA2026';
const REPO_USER   = 'rta200263';
const REPO_NAME   = 'rta-website';
const TOKEN_KEY   = '__rta_ghtoken__';

/* ── LOGIN ── */
function doLogin() {
  const v = document.getElementById('pass-input').value;
  if (v === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadAdmin();
  } else {
    document.getElementById('login-err').textContent = '⚠️ كلمة المرور غلط';
    document.getElementById('pass-input').style.borderColor = 'rgba(239,68,68,0.6)';
    setTimeout(() => {
      document.getElementById('pass-input').style.borderColor = '';
      document.getElementById('login-err').textContent = '';
    }, 2500);
  }
}
document.getElementById('pass-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* ── LOAD ADMIN DATA ── */
async function loadAdmin() {
  // Load saved token
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) {
    document.getElementById('f-token').value = saved;
    document.getElementById('token-saved-badge').style.display = 'flex';
  }

  // Visit counter
  try {
    const r = await fetch('https://api.countapi.xyz/get/rta200263-rta/visits');
    const d = await r.json();
    document.getElementById('visit-count').textContent = (d.value || 0).toLocaleString('ar-SA');
    document.getElementById('today-count').textContent = Math.floor((d.value || 0) / 7);
  } catch(e) {
    document.getElementById('visit-count').textContent = 'N/A';
    document.getElementById('today-count').textContent = 'N/A';
  }

  // Load current config
  try {
    const r = await fetch('https://raw.githubusercontent.com/' + REPO_USER + '/' + REPO_NAME + '/main/config.json?_=' + Date.now());
    const cfg = await r.json();
    if (cfg.discord)  document.getElementById('f-discord').value  = cfg.discord;
    if (cfg.youtube)  document.getElementById('f-youtube').value  = cfg.youtube;
    if (cfg.download) document.getElementById('f-download').value = cfg.download;
  } catch(e) {}
}

/* ── SAVE LINKS ── */
async function saveLinks() {
  let token = document.getElementById('f-token').value.trim();
  if (!token) { showMsg('أدخل GitHub Token أولاً', false); return; }

  // Save token to localStorage
  localStorage.setItem(TOKEN_KEY, token);
  document.getElementById('token-saved-badge').style.display = 'flex';

  const discord  = document.getElementById('f-discord').value.trim();
  const youtube  = document.getElementById('f-youtube').value.trim();
  const download = document.getElementById('f-download').value.trim();

  const newCfg = {};
  if (discord)  newCfg.discord  = discord;
  if (youtube)  newCfg.youtube  = youtube;
  if (download) newCfg.download = download;
  if (!Object.keys(newCfg).length) { showMsg('أدخل رابطاً واحداً على الأقل', false); return; }

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(newCfg, null, 2) + '\n')));
  const btn = document.querySelector('.btn-save');
  btn.textContent = '⏳ جاري الحفظ...';
  btn.disabled = true;

  try {
    const check = await fetch('https://api.github.com/repos/' + REPO_USER + '/' + REPO_NAME + '/contents/config.json', {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'RTA-Admin' }
    });
    const cd = await check.json();
    const sha = cd.sha;

    const res = await fetch('https://api.github.com/repos/' + REPO_USER + '/' + REPO_NAME + '/contents/config.json', {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json', 'User-Agent': 'RTA-Admin' },
      body: JSON.stringify({ message: 'Update links via admin panel', content, sha })
    });
    const data = await res.json();
    if (data.content) {
      showMsg('✅ تم الحفظ! يظهر على الموقع خلال دقيقة', true);
    } else {
      showMsg('❌ خطأ: ' + (data.message || 'فشل الحفظ'), false);
    }
  } catch(e) {
    showMsg('❌ خطأ في الاتصال', false);
  }
  btn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill"></i> حفظ وتحديث الروابط';
  btn.disabled = false;
}

/* ── CLEAR TOKEN ── */
function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('f-token').value = '';
  document.getElementById('token-saved-badge').style.display = 'none';
  showMsg('🗑️ تم مسح التوكن', true);
}

/* ── SHOW MSG ── */
function showMsg(text, ok) {
  const el = document.getElementById('save-msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}
</script>
</body>
</html>
